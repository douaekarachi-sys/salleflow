# =====================================================================
# SalleFlow - stack complete
#
#   docker compose up -d --build
#
#   app                API FastAPI          http://localhost:8000/docs
#   disponibilite      Regles RG-04/RG-05   http://localhost:8082/health
#   adminer            Interface base       http://localhost:8081
#   grafana            Tableaux de bord     http://localhost:3000
#   prometheus         Collecte metriques   http://localhost:9090
#   db                 PostgreSQL 16        localhost:5432 (pas de page web)
#   liquibase          Migrations, s'arrete une fois termine
#   postgres-exporter  Sonde PostgreSQL vers Prometheus
# =====================================================================

services:

  disponibilite:
    build: ./maven
    container_name: salleflow-disponibilite
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-salleflow}
      POSTGRES_USER: ${POSTGRES_USER:-salleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      PORT: 8082
      TZ: Africa/Casablanca
    ports:
      - "8082:8082"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8082/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: ./app
    container_name: salleflow-app
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      disponibilite:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-salleflow}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-salleflow}
      REGLES_DISPONIBILITE_URL: http://disponibilite:8082
      TZ: Africa/Casablanca
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 6

  db:
    image: postgres:16-alpine
    container_name: salleflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-salleflow}
      POSTGRES_USER: ${POSTGRES_USER:-salleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      TZ: Africa/Casablanca
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/tests:/tests:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salleflow} -d ${POSTGRES_DB:-salleflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Slide 42 - Database Deployment : migrations versionnees.
  #
  # Le conteneur applique le changelog puis s'arrete (Exited 0) : c'est
  # le comportement normal, pas une erreur.
  #
  # Commandes utiles, a lancer separement :
  #   docker compose run --rm liquibase status --verbose
  #   docker compose run --rm liquibase rollbackCount 1
  #   docker compose run --rm liquibase updateSQL      (previsualisation)
  liquibase:
    image: liquibase/liquibase:4.29
    container_name: salleflow-liquibase
    depends_on:
      db:
        condition: service_healthy
    working_dir: /liquibase/projet
    volumes:
      - ./db/changelog:/liquibase/projet/changelog:ro
    command: >
      --changeLogFile=changelog/db.changelog-master.xml
      --url=jdbc:postgresql://db:5432/${POSTGRES_DB:-salleflow}
      --username=${POSTGRES_USER:-salleflow}
      --password=${POSTGRES_PASSWORD:-changeme}
      --logLevel=info
      update

  adminer:
    image: adminer:latest
    container_name: salleflow-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    restart: unless-stopped

  # Slide 46 - Continuous Improvement
  prometheus:
    image: prom/prometheus:latest
    container_name: salleflow-prometheus
    depends_on:
      - postgres-exporter
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: salleflow-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-changeme}
      GF_USERS_ALLOW_SIGN_UP: "false"
      POSTGRES_DB: ${POSTGRES_DB:-salleflow}
      POSTGRES_USER: ${POSTGRES_USER:-salleflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped

  # PostgreSQL ne parle pas le protocole Prometheus : cet exporter traduit.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: salleflow-postgres-exporter
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-salleflow}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-salleflow}?sslmode=disable
    ports:
      - "9187:9187"
    restart: unless-stopped

volumes:
  pgdata:
  grafana-storage:
  prometheus-storage:
